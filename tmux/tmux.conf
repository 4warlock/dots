set -g prefix C-s
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position top
set -g status-style "bg=default bold"
set -g window-status-current-style "fg=blue bold"
set -g status-right ""
set -sg escape-time 0
set -g status-left "#[fg=colour240]#S  "
set -g status-left-length 30

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r v split-window -v
bind -r t split-window -h
bind -r c copy-mode
bind -r n new-window
bind -r p paste-buffer

bind-key -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key Tab last-window

bind r source-file ~/.config/tmux.conf \; display-message "Config reloaded."
bind 4 run-shell "~/.local/bin/tmux-sessionizer $HOME/notes"
bind 3 run-shell "~/.local/bin/tmux-sessionizer $HOME/python"
bind 2 run-shell "~/.local/bin/tmux-sessionizer $HOME/cstuff"
bind 1 run-shell "~/.local/bin/tmux-sessionizer $HOME/.config"
